<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(720px, 90vw);
      background: rgba(17, 24, 39, 0.9);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status {
      margin: 20px 0;
      font-size: 1.1rem;
      color: #dbeafe;
    }

    .meter {
      width: 100%;
      height: 28px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.08);
      margin: 20px 0;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34d399, #7dd3fc, #fbbf24);
      transition: width 0.08s ease;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      background: #7ef9a9;
      color: #08130e;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #7dd3fc;
      color: #06131b;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      color: #7dd3fc;
      text-decoration: none;
      font-weight: bold;
    }

    .mic-prompt {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(3, 7, 18, 0.78);
    }

    .mic-prompt[hidden] {
      display: none;
    }

    .prompt-card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 18px;
      background: #172033;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .prompt-card h2 {
      margin: 0 0 12px;
    }

    .prompt-card p {
      color: #dbeafe;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Voice Chat</h1>
    <div class="status" id="status">Microphone is off.</div>

    <div class="meter" aria-label="Microphone volume meter">
      <div class="meter-fill" id="meter"></div>
    </div>

    <div class="controls">
      <button id="toggleBtn">Enable Mic</button>
      <button id="muteBtn" class="secondary">Mute</button>
    </div>

    <a href="index.html">Back to arcade</a>
  </div>

  <div class="mic-prompt" id="micPrompt" role="dialog" aria-modal="true" aria-labelledby="promptTitle" aria-describedby="promptDescription">
    <div class="prompt-card">
      <h2 id="promptTitle">Enable your microphone?</h2>
      <p id="promptDescription">Voice Chat needs microphone access to detect your voice and show the audio level. Your browser will ask you to allow access.</p>
      <div class="controls">
        <button id="allowMicBtn">Allow microphone</button>
        <button id="cancelMicBtn" class="secondary">Not now</button>
      </div>
    </div>
  </div>

  <script>
    var statusEl = document.getElementById('status');
    var meterEl = document.getElementById('meter');
    var toggleBtn = document.getElementById('toggleBtn');
    var muteBtn = document.getElementById('muteBtn');
    var micPrompt = document.getElementById('micPrompt');
    var allowMicBtn = document.getElementById('allowMicBtn');
    var cancelMicBtn = document.getElementById('cancelMicBtn');

    var audioContext = null;
    var analyser = null;
    var micStream = null;
    var sourceNode = null;
    var muted = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function updateMeter() {
      if (!analyser) return;

      var data = new Uint8Array(analyser.fftSize);
      analyser.getByteFrequencyData(data);

      var total = 0;
      for (var i = 0; i < data.length; i++) {
        total += data[i];
      }
      var avg = total / data.length;
      var percent = Math.min(100, avg / 255 * 100);

      meterEl.style.width = percent + '%';

      if (!muted && micStream) {
        setStatus('Microphone is live. Press the button again to stop.');
      }

      requestAnimationFrame(updateMeter);
    }

    function stopMic() {
      if (micStream) {
        micStream.getTracks().forEach(function(track) {
          track.stop();
        });
      }
      if (sourceNode) {
        sourceNode.disconnect();
      }
      if (audioContext) {
        audioContext.close();
      }
      micStream = null;
      sourceNode = null;
      analyser = null;
      audioContext = null;
      meterEl.style.width = '0%';
      setStatus('Microphone is off.');
      toggleBtn.textContent = 'Enable Mic';
    }

    async function startMic() {
      micPrompt.hidden = true;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('This browser does not support microphone access.');
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        sourceNode = audioContext.createMediaStreamSource(micStream);
        sourceNode.connect(analyser);

        toggleBtn.textContent = 'Disable Mic';
        setStatus('Microphone is live.');
        requestAnimationFrame(updateMeter);
      } catch (error) {
        setStatus('Microphone permission was denied or unavailable.');
      }
    }

    toggleBtn.addEventListener('click', function() {
      if (micStream) {
        stopMic();
      } else {
        micPrompt.hidden = false;
        allowMicBtn.focus();
      }
    });

    allowMicBtn.addEventListener('click', startMic);

    cancelMicBtn.addEventListener('click', function() {
      micPrompt.hidden = true;
      setStatus('Microphone access was not enabled.');
      toggleBtn.focus();
    });

    muteBtn.addEventListener('click', function() {
      muted = !muted;
      if (micStream) {
        micStream.getAudioTracks().forEach(function(track) {
          track.enabled = !muted;
        });
      }
      setStatus(muted ? 'Voice chat muted.' : 'Microphone is live.');
      muteBtn.textContent = muted ? 'Unmute' : 'Mute';
    });
  </script>
</body>
</html>
