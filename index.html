<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snake retro king</title>
  <style>
    body {
      background: #738;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    canvas {
      width: min(1000px, 100vw);
      height: auto;
      border: 2px solid white;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
<canvas width="1000" height="560" id="game"></canvas>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');
var grid = 16;
var count = 0;

var snake = {
  x: 160,
  y: 160,
  dx: grid,
  dy: 0,
  cells: [],
  maxCells: 4
};

var apple = {
  x: 320,
  y: 320
};

function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

function loop() {
  requestAnimationFrame(loop);
  if (++count < 6) {
    return;
  }
  count = 0;
  context.clearRect(0, 0, canvas.width, canvas.height);

  snake.x += snake.dx;
  snake.y += snake.dy;

  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  } else if (snake.x >= canvas.width) {
    snake.x = 0;
  }
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  } else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  snake.cells.unshift({x: snake.x, y: snake.y});

  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

  context.fillStyle = 'lime';
  snake.cells.forEach(function(cell, index) {
    context.fillRect(cell.x, cell.y, grid - 1, grid - 1);
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;
      apple.x = getRandomInt(0, Math.floor(canvas.width / grid)) * grid;
      apple.y = getRandomInt(0, Math.floor(canvas.height / grid)) * grid;
    }
    for (var i = index + 1; i < snake.cells.length; i++) {
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;
        apple.x = getRandomInt(0, Math.floor(canvas.width / grid)) * grid;
        apple.y = getRandomInt(0, Math.floor(canvas.height / grid)) * grid;
      }
    }
  });
}

document.addEventListener('keydown', function(e) {
  if ((e.key === 'ArrowLeft' || e.which === 37) && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  } else if ((e.key === 'ArrowUp' || e.which === 38) && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  } else if ((e.key === 'ArrowRight' || e.which === 39) && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  } else if ((e.key === 'ArrowDown' || e.which === 40) && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
